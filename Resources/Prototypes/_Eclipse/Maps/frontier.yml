- type: gameMap
  id: Frontier
  mapName: 'Frontier Station'
  mapPath: /Maps/_Eclipse/NewFrontier.yml
  minPlayers: 0
  maxRandomOffset: 0
  randomRotation: false
  stations:
    Frontier:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Frontier Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TG'
        - type: StationJobs
          availableJobs:
            StationRepresentative: [ 1, 1 ]
            StationTrafficController: [ 1, 1 ]
            FrontierSecurityGuard: [ 1, 1 ]
            Mailman: [ 1, 1 ]
            FrontierJanitor: [ 1, 1 ]
            Attorney: [ 1, 1 ]
            Explorer: [ -1, -1 ] #infinite, not counted

