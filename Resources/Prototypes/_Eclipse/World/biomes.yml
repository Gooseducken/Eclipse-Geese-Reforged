- type: spaceBiome
  id: AsteroidsInner
  priority: 0
  noiseRanges: {}
  distanceRanges:
    - 0, 3500
  chunkComponents:
    - type: DebrisFeaturePlacerController
      densityNoiseChannel: Density
    - type: SimpleDebrisSelector
      debrisTable:
        - id: AsteroidDebrisSmall
        - id: AsteroidDebrisMedium
        - id: AsteroidDebrisLarge
          prob: 0.7
        - id: AsteroidDebrisLarger
          prob: 0.4
        - id: AsteroidDebris14r48f
          prob: 0.1
    - type: NoiseDrivenDebrisSelector
      noiseChannel: Wreck
      debrisTable:
        - id: ScrapDebrisExtendedSmall
        - id: ScrapDebrisExtendedMedium
        - id: ScrapDebrisExtendedLarge
          prob: 0.5
    - type: NoiseRangeCarver
      ranges:
        - 0.4, 0.4
      noiseChannel: Carver

- type: spaceBiome
  id: AsteroidsCircle
  priority: 0
  noiseRanges: {}
  distanceRanges:
    - 3500, 4500
    - 20000, 200000
  chunkComponents:
    - type: DebrisFeaturePlacerController
      densityNoiseChannel: DensityHighDensity
    - type: SimpleDebrisSelector
      debrisTable:
        - id: AsteroidDebrisSmall
          prob: 0.3
        - id: AsteroidDebrisMedium
          prob: 0.5
        - id: AsteroidDebrisLarge
          prob: 0.7
        - id: AsteroidDebrisLarger
        - id: AsteroidDebris14r48f
          prob: 0.7
    - type: NoiseDrivenDebrisSelector
      noiseChannel: WreckLowDensity
      debrisTable:
        - id: ScrapDebrisExtendedSmall
        - id: ScrapDebrisExtendedMedium
        - id: ScrapDebrisExtendedLarge
          prob: 0.5
