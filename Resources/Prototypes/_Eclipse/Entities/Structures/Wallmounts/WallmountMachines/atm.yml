- type: entity
  parent: BaseWallmountMachine
  id: WallATM
  name: ATM
  suffix: Wallmount
  description:
  components:
  - type: Sprite
    sprite: _Eclipse/Structures/Wallmounts/atm.rsi
    noRot: true
    layers:
    - state: icon
    - state: unshaded
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: {visible: true}
          False: {visible: false}
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ATM
    cashSlot:
      name: atm-cash-slot
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - Cash
  - type: ActivatableUI
    singleUser: true
    key: enum.ATMUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.ATMUiKey.Key:
        type: ATMBoundUserInterface
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      cashSlot: !type:ContainerSlot
