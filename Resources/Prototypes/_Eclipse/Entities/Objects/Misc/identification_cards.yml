      color: &color-service-top "#639137"
    - state: stripe_bottom
      color: &color-service-bottom "#446326"
    - sprite: *icon-rsi
      offset: *icon-offset
      state: Janitor
  - type: PresetIdCard
    job: FrontierJanitor

