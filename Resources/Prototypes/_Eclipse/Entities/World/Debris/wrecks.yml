  id: ScrapDebrisExtendedMedium
  parent: BaseScrapDebrisExtended
  name: scrap debris medium
  categories: [ HideSpawnMenu ]
  components:
    - type: MapGrid
    - type: BlobFloorPlanBuilder
      floorPlacements: 16

- type: entity
